version: '3.8'

# DEPRECATED: This file is kept for reference only
# The project NO LONGER uses BFF (Backend-for-Frontend) architecture
# Frontends call https://dev-creamat.fds-1.com/gateway/ directly
#
# Use docker-compose.bff.traefik.yml for testing

services:
  # Container App
  container-app:
    build:
      context: ./frontend/container
      dockerfile: Dockerfile
    container_name: micro-frontend-container-test
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - DOCKER_MODE=true
    networks:
      - micro-frontend-network
    depends_on:
      - user-management-app
      - catalog-app
      - orders-app
      - data-grid-app
      - analytics-app
      - settings-app

  # User Management App
  user-management-app:
    build:
      context: ./frontend/user-management-app
      dockerfile: Dockerfile
    container_name: micro-frontend-user-management-test
    ports:
      - "3001:80"
    networks:
      - micro-frontend-network

  # Data Grid App
  data-grid-app:
    build:
      context: ./frontend/data-grid-app
      dockerfile: Dockerfile
    container_name: micro-frontend-data-grid-test
    ports:
      - "3002:80"
    networks:
      - micro-frontend-network

  # Analytics App
  analytics-app:
    build:
      context: ./frontend/analytics-app
      dockerfile: Dockerfile
    container_name: micro-frontend-analytics-test
    ports:
      - "3003:80"
    networks:
      - micro-frontend-network

  # Settings App
  settings-app:
    build:
      context: ./frontend/settings-app
      dockerfile: Dockerfile
    container_name: micro-frontend-settings-test
    ports:
      - "3004:80"
    networks:
      - micro-frontend-network

  # Orders App
  orders-app:
    build:
      context: ./frontend/orders-app
      dockerfile: Dockerfile
    container_name: micro-frontend-orders-test
    ports:
      - "3005:80"
    networks:
      - micro-frontend-network

  # Catalog App
  catalog-app:
    build:
      context: ./frontend/catalog-app
      dockerfile: Dockerfile
    container_name: micro-frontend-catalog-test
    ports:
      - "3006:80"
    networks:
      - micro-frontend-network

networks:
  micro-frontend-network:
    driver: bridge
