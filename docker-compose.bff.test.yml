version: '3.8'

services:
  # Mock Backend Service for Testing
  backend-mock:
    build:
      context: ./backend/mock-data-service
      dockerfile: Dockerfile
    container_name: micro-frontend-backend-test-bff
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - JWT_SECRET_KEY_FILE=/run/secrets/jwt_secret_key
      - JWT_REFRESH_SECRET_KEY_FILE=/run/secrets/jwt_refresh_secret_key
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    networks:
      - micro-frontend-network
    secrets:
      - jwt_secret_key
      - jwt_refresh_secret_key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # User Management BFF
  user-management-bff:
    build:
      context: .
      dockerfile: frontend/user-management-app/Dockerfile.bff
    container_name: user-management-bff-test
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - BFF_PORT=4001
      - FRONTEND_PORT=3001
      - BACKEND_USER_SERVICE_URL=http://backend-mock:8000
    networks:
      - micro-frontend-network
    depends_on:
      backend-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Catalog BFF
  catalog-bff:
    build:
      context: .
      dockerfile: frontend/catalog-app/Dockerfile.bff
    container_name: catalog-bff-test
    ports:
      - "4006:4006"
    environment:
      - NODE_ENV=production
      - BFF_PORT=4006
      - FRONTEND_PORT=3006
      - BACKEND_CATALOG_SERVICE_URL=http://backend-mock:8000
      - BACKEND_CDN_SERVICE_URL=http://backend-mock:8000
      - ENABLE_CACHING=false
    networks:
      - micro-frontend-network
    depends_on:
      backend-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4006/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Orders BFF
  orders-bff:
    build:
      context: .
      dockerfile: frontend/orders-app/Dockerfile.bff
    container_name: orders-bff-test
    ports:
      - "4005:4005"
    environment:
      - NODE_ENV=production
      - BFF_PORT=4005
      - FRONTEND_PORT=3005
      - BACKEND_ORDER_SERVICE_URL=http://backend-mock:8000
    networks:
      - micro-frontend-network
    depends_on:
      backend-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4005/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Other micro-frontends
  data-grid-app:
    build:
      context: ./frontend/data-grid-app
      dockerfile: Dockerfile
    container_name: micro-frontend-data-grid-test-bff
    ports:
      - "3002:80"
    networks:
      - micro-frontend-network

  analytics-app:
    build:
      context: ./frontend/analytics-app
      dockerfile: Dockerfile
    container_name: micro-frontend-analytics-test-bff
    ports:
      - "3003:80"
    networks:
      - micro-frontend-network

  settings-app:
    build:
      context: ./frontend/settings-app
      dockerfile: Dockerfile
    container_name: micro-frontend-settings-test-bff
    ports:
      - "3004:80"
    networks:
      - micro-frontend-network

  # Container App
  container-app:
    build:
      context: ./frontend/container
      dockerfile: Dockerfile
    container_name: micro-frontend-container-test-bff
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - DOCKER_MODE=true
      - BFF_MODE=true
    networks:
      - micro-frontend-network
    depends_on:
      - user-management-bff
      - catalog-bff
      - orders-bff
      - data-grid-app
      - analytics-app
      - settings-app

networks:
  micro-frontend-network:
    driver: bridge

secrets:
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  jwt_refresh_secret_key:
    file: ./secrets/jwt_refresh_secret_key.txt

