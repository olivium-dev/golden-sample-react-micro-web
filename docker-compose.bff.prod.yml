version: '3.8'

# DEPRECATED: This file is kept for reference only
# The project NO LONGER uses BFF (Backend-for-Frontend) architecture
# Frontends call https://dev-creamat.fds-1.com/gateway/ directly
#
# Use docker-compose.bff.traefik.prod.yml instead for production with Traefik

services:
  # Container App (Main Host)
  container-app:
    build:
      context: ./frontend/container
      dockerfile: Dockerfile
    container_name: micro-frontend-container-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
      - DOCKER_MODE=true
    networks:
      - micro-frontend-network
    depends_on:
      - user-management-app
      - catalog-app
      - orders-app
      - data-grid-app
      - analytics-app
      - settings-app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # User Management App
  user-management-app:
    build:
      context: ./frontend/user-management-app
      dockerfile: Dockerfile
    container_name: micro-frontend-user-management-prod
    ports:
      - "3001:80"
    networks:
      - micro-frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Data Grid App
  data-grid-app:
    build:
      context: ./frontend/data-grid-app
      dockerfile: Dockerfile
    container_name: micro-frontend-data-grid-prod
    ports:
      - "3002:80"
    networks:
      - micro-frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Analytics App
  analytics-app:
    build:
      context: ./frontend/analytics-app
      dockerfile: Dockerfile
    container_name: micro-frontend-analytics-prod
    ports:
      - "3003:80"
    networks:
      - micro-frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Settings App
  settings-app:
    build:
      context: ./frontend/settings-app
      dockerfile: Dockerfile
    container_name: micro-frontend-settings-prod
    ports:
      - "3004:80"
    networks:
      - micro-frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Orders App
  orders-app:
    build:
      context: ./frontend/orders-app
      dockerfile: Dockerfile
    container_name: micro-frontend-orders-prod
    ports:
      - "3005:80"
    networks:
      - micro-frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Catalog App
  catalog-app:
    build:
      context: ./frontend/catalog-app
      dockerfile: Dockerfile
    container_name: micro-frontend-catalog-prod
    ports:
      - "3006:80"
    networks:
      - micro-frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  micro-frontend-network:
    driver: bridge
