version: '3.8'

services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik:v2.10
    container_name: traefik-bff
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"       # HTTP
      - "8080:8080"   # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - micro-frontend-network
    restart: unless-stopped

  # Backend Service (Mock for development)
  backend:
    build:
      context: ./backend/mock-data-service
      dockerfile: Dockerfile
    container_name: micro-frontend-backend-bff
    environment:
      - PYTHONUNBUFFERED=1
      - JWT_SECRET_KEY_FILE=/run/secrets/jwt_secret_key
      - JWT_REFRESH_SECRET_KEY_FILE=/run/secrets/jwt_refresh_secret_key
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
    volumes:
      - ./backend/mock-data-service:/app
      - backend-cache:/root/.cache
    networks:
      - micro-frontend-network
    secrets:
      - jwt_secret_key
      - jwt_refresh_secret_key
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`localhost`) && PathPrefix(`/backend`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.backend-strip.stripprefix.prefixes=/backend"
      - "traefik.http.routers.backend.middlewares=backend-strip"

  # User Management BFF
  user-management-bff:
    build:
      context: .
      dockerfile: frontend/user-management-app/Dockerfile.bff
    container_name: user-management-bff
    environment:
      - NODE_ENV=production
      - BFF_PORT=4001
      - FRONTEND_PORT=3001
      - BACKEND_USER_SERVICE_URL=http://backend:8000
    networks:
      - micro-frontend-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user-bff.rule=Host(`localhost`) && PathPrefix(`/api/users`)"
      - "traefik.http.routers.user-bff.entrypoints=web"
      - "traefik.http.services.user-bff.loadbalancer.server.port=4001"

  # Catalog BFF
  catalog-bff:
    build:
      context: .
      dockerfile: frontend/catalog-app/Dockerfile.bff
    container_name: catalog-bff
    environment:
      - NODE_ENV=production
      - BFF_PORT=4006
      - FRONTEND_PORT=3006
      - BACKEND_CATALOG_SERVICE_URL=https://dev-creamat.fds-1.com/catalog
      - BACKEND_CDN_SERVICE_URL=https://dev-creamat.fds-1.com/cdn
      - ENABLE_CACHING=false
    networks:
      - micro-frontend-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4006/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catalog-bff.rule=Host(`localhost`) && (PathPrefix(`/api/catalog`) || PathPrefix(`/api/cdn`))"
      - "traefik.http.routers.catalog-bff.entrypoints=web"
      - "traefik.http.services.catalog-bff.loadbalancer.server.port=4006"

  # Orders BFF
  orders-bff:
    build:
      context: .
      dockerfile: frontend/orders-app/Dockerfile.bff
    container_name: orders-bff
    environment:
      - NODE_ENV=production
      - BFF_PORT=4005
      - FRONTEND_PORT=3005
      - BACKEND_ORDER_SERVICE_URL=https://dev-creamat.fds-1.com/order
    networks:
      - micro-frontend-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4005/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orders-bff.rule=Host(`localhost`) && PathPrefix(`/api/orders`)"
      - "traefik.http.routers.orders-bff.entrypoints=web"
      - "traefik.http.services.orders-bff.loadbalancer.server.port=4005"

  # Data Grid App
  data-grid-app:
    build:
      context: ./frontend/data-grid-app
      dockerfile: Dockerfile
    container_name: micro-frontend-data-grid-bff
    networks:
      - micro-frontend-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.data-grid.rule=Host(`localhost`) && PathPrefix(`/data-grid`)"
      - "traefik.http.routers.data-grid.entrypoints=web"
      - "traefik.http.services.data-grid.loadbalancer.server.port=80"
      - "traefik.http.middlewares.data-grid-strip.stripprefix.prefixes=/data-grid"
      - "traefik.http.routers.data-grid.middlewares=data-grid-strip"

  # Analytics App
  analytics-app:
    build:
      context: ./frontend/analytics-app
      dockerfile: Dockerfile
    container_name: micro-frontend-analytics-bff
    networks:
      - micro-frontend-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.analytics.rule=Host(`localhost`) && PathPrefix(`/analytics`)"
      - "traefik.http.routers.analytics.entrypoints=web"
      - "traefik.http.services.analytics.loadbalancer.server.port=80"
      - "traefik.http.middlewares.analytics-strip.stripprefix.prefixes=/analytics"
      - "traefik.http.routers.analytics.middlewares=analytics-strip"

  # Settings App
  settings-app:
    build:
      context: ./frontend/settings-app
      dockerfile: Dockerfile
    container_name: micro-frontend-settings-bff
    networks:
      - micro-frontend-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.settings.rule=Host(`localhost`) && PathPrefix(`/settings`)"
      - "traefik.http.routers.settings.entrypoints=web"
      - "traefik.http.services.settings.loadbalancer.server.port=80"
      - "traefik.http.middlewares.settings-strip.stripprefix.prefixes=/settings"
      - "traefik.http.routers.settings.middlewares=settings-strip"

  # Container App (Main Host) - Highest Priority
  container-app:
    build:
      context: ./frontend/container
      dockerfile: Dockerfile
    container_name: micro-frontend-container-bff
    environment:
      - NODE_ENV=production
      - DOCKER_MODE=true
      - BFF_MODE=true
    networks:
      - micro-frontend-network
    depends_on:
      - user-management-bff
      - catalog-bff
      - orders-bff
      - data-grid-app
      - analytics-app
      - settings-app
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.container.rule=Host(`localhost`)"
      - "traefik.http.routers.container.entrypoints=web"
      - "traefik.http.routers.container.priority=1"
      - "traefik.http.services.container.loadbalancer.server.port=80"

networks:
  micro-frontend-network:
    driver: bridge

volumes:
  backend-cache:

secrets:
  jwt_secret_key:
    file: ./secrets/jwt_secret_key.txt
  jwt_refresh_secret_key:
    file: ./secrets/jwt_refresh_secret_key.txt

