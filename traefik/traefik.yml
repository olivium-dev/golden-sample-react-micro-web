api:
  dashboard: true
  insecure: true  # For initial testing, will secure in production

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
    network: micro-frontend-network
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

log:
  level: INFO
  
accessLog:
  filePath: /var/log/traefik/access.log

