version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend/mock-data-service
      dockerfile: Dockerfile
    container_name: micro-frontend-backend
    ports:
      - "30001:30001"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=30001
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY:-dev-refresh-secret-key-change-in-production}
      - CORS_ORIGINS=http://localhost:30002,https://fds-1.com
    networks:
      - micro-frontend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:30001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Container App (Main Host)
  container:
    build:
      context: .
      dockerfile: frontend/container/Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:30001
    container_name: micro-frontend-container
    ports:
      - "30002:80"
    depends_on:
      - backend
    networks:
      - micro-frontend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # User Management Micro-Frontend
  user-management:
    build:
      context: .
      dockerfile: frontend/user-management-app/Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:30001
    container_name: micro-frontend-user-management
    ports:
      - "30003:80"
    depends_on:
      - backend
    networks:
      - micro-frontend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Data Grid Micro-Frontend
  data-grid:
    build:
      context: .
      dockerfile: frontend/data-grid-app/Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:30001
    container_name: micro-frontend-data-grid
    ports:
      - "30004:80"
    depends_on:
      - backend
    networks:
      - micro-frontend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Analytics Micro-Frontend
  analytics:
    build:
      context: .
      dockerfile: frontend/analytics-app/Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:30001
    container_name: micro-frontend-analytics
    ports:
      - "30005:80"
    depends_on:
      - backend
    networks:
      - micro-frontend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Settings Micro-Frontend
  settings:
    build:
      context: .
      dockerfile: frontend/settings-app/Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:30001
    container_name: micro-frontend-settings
    ports:
      - "30006:80"
    depends_on:
      - backend
    networks:
      - micro-frontend-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy (Optional - for unified access)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: micro-frontend-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - container
      - user-management
      - data-grid
      - analytics
      - settings
      - backend
    networks:
      - micro-frontend-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  micro-frontend-network:
    driver: bridge

volumes:
  backend-data: