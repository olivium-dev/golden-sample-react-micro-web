version: '3.8'

# Production Docker Compose without Traefik
# NO BFF - Frontends call https://dev-creamat.fds-1.com/gateway/ directly
# NO Mock Backend - Using real backend

services:
  # Container App (Main Host)
  container-app:
    build:
      context: ./frontend/container
      dockerfile: Dockerfile
    container_name: micro-frontend-container-prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - micro-frontend-network
    depends_on:
      - user-management-app
      - data-grid-app
      - analytics-app
      - settings-app
      - orders-app
      - catalog-app
    restart: unless-stopped

  # User Management App
  user-management-app:
    build:
      context: ./frontend/user-management-app
      dockerfile: Dockerfile
    container_name: micro-frontend-user-management-prod
    ports:
      - "3001:80"
    networks:
      - micro-frontend-network
    restart: unless-stopped

  # Data Grid App
  data-grid-app:
    build:
      context: ./frontend/data-grid-app
      dockerfile: Dockerfile
    container_name: micro-frontend-data-grid-prod
    ports:
      - "3002:80"
    networks:
      - micro-frontend-network
    restart: unless-stopped

  # Analytics App
  analytics-app:
    build:
      context: ./frontend/analytics-app
      dockerfile: Dockerfile
    container_name: micro-frontend-analytics-prod
    ports:
      - "3003:80"
    networks:
      - micro-frontend-network
    restart: unless-stopped

  # Settings App
  settings-app:
    build:
      context: ./frontend/settings-app
      dockerfile: Dockerfile
    container_name: micro-frontend-settings-prod
    ports:
      - "3004:80"
    networks:
      - micro-frontend-network
    restart: unless-stopped

  # Orders App
  orders-app:
    build:
      context: ./frontend/orders-app
      dockerfile: Dockerfile
    container_name: micro-frontend-orders-prod
    ports:
      - "3005:80"
    networks:
      - micro-frontend-network
    restart: unless-stopped

  # Catalog App
  catalog-app:
    build:
      context: ./frontend/catalog-app
      dockerfile: Dockerfile
    container_name: micro-frontend-catalog-prod
    ports:
      - "3006:80"
    networks:
      - micro-frontend-network
    restart: unless-stopped

networks:
  micro-frontend-network:
    driver: bridge
