# Nginx configuration to handle micro-frontend routing
# This should be deployed as a reverse proxy in front of the micro-frontends

server {
    listen 80;
    server_name _;

    # Main container app - serve normally
    location / {
        proxy_pass http://localhost:30002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints - proxy to backend
    location /api/ {
        proxy_pass http://localhost:30001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Micro-frontend remoteEntry.js files - serve normally for Module Federation
    location ~ ^/(30003|30004|30005|30006)/remoteEntry\.js$ {
        set $target_port $1;
        proxy_pass http://localhost:$target_port/remoteEntry.js;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # CORS headers for Module Federation
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
    }

    # Direct access to micro-frontends - redirect to container with hash
    location = /30003/ {
        return 302 /#users;
    }
    
    location = /30004/ {
        return 302 /#data;
    }
    
    location = /30005/ {
        return 302 /#analytics;
    }
    
    location = /30006/ {
        return 302 /#settings;
    }

    # Block all other direct access to micro-frontend ports
    location ~ ^/(30003|30004|30005|30006)/ {
        return 302 /;
    }
}
