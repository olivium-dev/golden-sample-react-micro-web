version: '3.8'

# Simple Docker Compose for local development
# NO BFF - Frontends call https://dev-creamat.fds-1.com/gateway/ directly
# NO Mock Backend - Using real backend

services:
  # Container App (Main Host)
  container-app:
    build:
      context: ./frontend/container
      dockerfile: Dockerfile.dev
    container_name: micro-frontend-container
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/container:/app
      - /app/node_modules
      - ./frontend/shared-ui-lib:/app/shared-ui-lib
    networks:
      - micro-frontend-network
    depends_on:
      - user-management-app
      - data-grid-app
      - analytics-app
      - settings-app
      - orders-app
      - catalog-app
    command: npx webpack serve --config webpack.minimal.js --host 0.0.0.0

  # User Management App
  user-management-app:
    build:
      context: ./frontend/user-management-app
      dockerfile: Dockerfile.dev
    container_name: micro-frontend-user-management
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/user-management-app:/app
      - /app/node_modules
      - ./frontend/shared-ui-lib:/app/shared-ui-lib
    networks:
      - micro-frontend-network
    command: npx webpack serve --config webpack.minimal.js --host 0.0.0.0

  # Data Grid App
  data-grid-app:
    build:
      context: ./frontend/data-grid-app
      dockerfile: Dockerfile.dev
    container_name: micro-frontend-data-grid
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/data-grid-app:/app
      - /app/node_modules
      - ./frontend/shared-ui-lib:/app/shared-ui-lib
    networks:
      - micro-frontend-network
    command: npx webpack serve --config webpack.minimal.js --host 0.0.0.0

  # Analytics App
  analytics-app:
    build:
      context: ./frontend/analytics-app
      dockerfile: Dockerfile.dev
    container_name: micro-frontend-analytics
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/analytics-app:/app
      - /app/node_modules
      - ./frontend/shared-ui-lib:/app/shared-ui-lib
    networks:
      - micro-frontend-network
    command: npx webpack serve --config webpack.minimal.js --host 0.0.0.0

  # Settings App
  settings-app:
    build:
      context: ./frontend/settings-app
      dockerfile: Dockerfile.dev
    container_name: micro-frontend-settings
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/settings-app:/app
      - /app/node_modules
      - ./frontend/shared-ui-lib:/app/shared-ui-lib
    networks:
      - micro-frontend-network
    command: npx webpack serve --config webpack.minimal.js --host 0.0.0.0

  # Orders App
  orders-app:
    build:
      context: ./frontend/orders-app
      dockerfile: Dockerfile.dev
    container_name: micro-frontend-orders
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/orders-app:/app
      - /app/node_modules
      - ./frontend/shared-ui-lib:/app/shared-ui-lib
    networks:
      - micro-frontend-network
    command: npx webpack serve --config webpack.minimal.js --host 0.0.0.0

  # Catalog App
  catalog-app:
    build:
      context: ./frontend/catalog-app
      dockerfile: Dockerfile.dev
    container_name: micro-frontend-catalog
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/catalog-app:/app
      - /app/node_modules
      - ./frontend/shared-ui-lib:/app/shared-ui-lib
    networks:
      - micro-frontend-network
    command: npx webpack serve --config webpack.minimal.js --host 0.0.0.0

networks:
  micro-frontend-network:
    driver: bridge
