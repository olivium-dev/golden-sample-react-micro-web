# ============================================
# Docker Compose - Run Only (No Build)
# Uses pre-built images only
# Minimal resource usage
# ============================================

services:
  # Traefik Reverse Proxy
  traefik:
    image: traefik:v2.10
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - micro-frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Container App (Main Host)
  container-app:
    build:
      context: ./frontend/container
      dockerfile: Dockerfile
    image: creamati-cms-container:latest
    container_name: micro-frontend-container
    environment:
      - NODE_ENV=production
      - DOCKER_MODE=true
    networks:
      - micro-frontend-network
    depends_on:
      - user-management-app
      - orders-app
      - catalog-app
      - data-grid-app
      - analytics-app
      - settings-app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.container.rule=Host(`localhost`)"
      - "traefik.http.routers.container.entrypoints=web"
      - "traefik.http.routers.container.priority=1"
      - "traefik.http.services.container.loadbalancer.server.port=80"

  # User Management App
  user-management-app:
    build:
      context: ./frontend/user-management-app
      dockerfile: Dockerfile
    image: creamati-cms-user-management:latest
    container_name: micro-frontend-user-management
    networks:
      - micro-frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user-management.rule=Host(`localhost`) && PathPrefix(`/remoteEntry-user.js`)"
      - "traefik.http.routers.user-management.entrypoints=web"
      - "traefik.http.services.user-management.loadbalancer.server.port=80"

  # Data Grid App
  data-grid-app:
    build:
      context: ./frontend/data-grid-app
      dockerfile: Dockerfile
    image: creamati-cms-data-grid:latest
    container_name: micro-frontend-data-grid
    networks:
      - micro-frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.data-grid.rule=Host(`localhost`) && PathPrefix(`/remoteEntry-data-grid.js`)"
      - "traefik.http.routers.data-grid.entrypoints=web"
      - "traefik.http.services.data-grid.loadbalancer.server.port=80"

  # Analytics App
  analytics-app:
    build:
      context: ./frontend/analytics-app
      dockerfile: Dockerfile
    image: creamati-cms-analytics:latest
    container_name: micro-frontend-analytics
    networks:
      - micro-frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.analytics.rule=Host(`localhost`) && PathPrefix(`/remoteEntry-analytics.js`)"
      - "traefik.http.routers.analytics.entrypoints=web"
      - "traefik.http.services.analytics.loadbalancer.server.port=80"

  # Settings App
  settings-app:
    build:
      context: ./frontend/settings-app
      dockerfile: Dockerfile
    image: creamati-cms-settings:latest
    container_name: micro-frontend-settings
    networks:
      - micro-frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.settings.rule=Host(`localhost`) && PathPrefix(`/remoteEntry-settings.js`)"
      - "traefik.http.routers.settings.entrypoints=web"
      - "traefik.http.services.settings.loadbalancer.server.port=80"

  # Orders App
  orders-app:
    build:
      context: ./frontend/orders-app
      dockerfile: Dockerfile
    image: creamati-cms-orders:latest
    container_name: micro-frontend-orders
    networks:
      - micro-frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orders.rule=Host(`localhost`) && PathPrefix(`/remoteEntry-orders.js`)"
      - "traefik.http.routers.orders.entrypoints=web"
      - "traefik.http.services.orders.loadbalancer.server.port=80"

  # Catalog App
  catalog-app:
    build:
      context: ./frontend/catalog-app
      dockerfile: Dockerfile
    image: creamati-cms-catalog:latest
    container_name: micro-frontend-catalog
    networks:
      - micro-frontend-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.catalog.rule=Host(`localhost`) && PathPrefix(`/remoteEntry-catalog.js`)"
      - "traefik.http.routers.catalog.entrypoints=web"
      - "traefik.http.services.catalog.loadbalancer.server.port=80"

networks:
  micro-frontend-network:
    driver: bridge

