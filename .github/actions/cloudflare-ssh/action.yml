name: 'Cloudflare SSH Connection'
description: 'Establishes SSH connection through Cloudflare tunnel'
inputs:
  ssh-private-key:
    description: 'Base64 encoded SSH private key'
    required: true
  server-hostname:
    description: 'Cloudflare tunnel hostname'
    required: true
  server-user:
    description: 'SSH username'
    required: true
    default: 'ec2-user'
  connect-timeout:
    description: 'Connection timeout in seconds'
    required: false
    default: '30'
  host-alias:
    description: 'SSH host alias for subsequent connections'
    required: false
    default: 'target-server'
  cloudflare-service-token-id:
    description: 'Cloudflare Access Service Token ID (optional)'
    required: false
    default: ''
  cloudflare-service-token-secret:
    description: 'Cloudflare Access Service Token Secret (optional)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install cloudflared
      shell: bash
      run: |
        echo "📥 Installing cloudflared..."
        
        # Download and install cloudflared
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb || sudo apt-get install -f -y
        
        # Verify installation
        cloudflared version
        echo "✅ cloudflared installed: $(cloudflared version)"

    - name: Setup SSH key and configuration
      shell: bash
      env:
        CF_ACCESS_CLIENT_ID: ${{ inputs.cloudflare-service-token-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.cloudflare-service-token-secret }}
      run: |
        echo "🔑 Setting up SSH key and configuration..."
        
        # Create SSH directory
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Handle SSH private key (try base64 decode first, fallback to raw)
        echo "🔍 Processing SSH private key..."
        if echo "${{ inputs.ssh-private-key }}" | grep -q "^-----BEGIN"; then
          echo "✅ Detected raw SSH private key format"
          echo "${{ inputs.ssh-private-key }}" > ~/.ssh/id_rsa
        else
          echo "🔍 Attempting to decode base64 SSH private key..."
          if echo "${{ inputs.ssh-private-key }}" | tr -d '\n\r' | base64 -d > ~/.ssh/id_rsa 2>/dev/null && [ -s ~/.ssh/id_rsa ]; then
            echo "✅ Successfully decoded base64 SSH key"
          else
            echo "❌ Base64 decode failed, treating as raw key"
            echo "${{ inputs.ssh-private-key }}" > ~/.ssh/id_rsa
          fi
        fi
        chmod 600 ~/.ssh/id_rsa
        
        # Export Cloudflare tokens if provided
        if [ -n "$CF_ACCESS_CLIENT_ID" ]; then
          echo "🔐 Cloudflare Access tokens detected"
          echo "CF_ACCESS_CLIENT_ID=$CF_ACCESS_CLIENT_ID" >> $GITHUB_ENV
          echo "CF_ACCESS_CLIENT_SECRET=$CF_ACCESS_CLIENT_SECRET" >> $GITHUB_ENV
        fi
        
        # Create SSH config for Cloudflare tunnel
        cat >> ~/.ssh/config << EOF
        Host ${{ inputs.host-alias }}
          HostName ${{ inputs.server-hostname }}
          User ${{ inputs.server-user }}
          IdentityFile ~/.ssh/id_rsa
          ProxyCommand cloudflared access tcp --hostname ${{ inputs.server-hostname }}
          ConnectTimeout ${{ inputs.connect-timeout }}
          ServerAliveInterval 60
          ServerAliveCountMax 3
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF
        
        chmod 600 ~/.ssh/config
        echo "✅ SSH configuration created for host: ${{ inputs.host-alias }}"

    - name: Test SSH connection
      shell: bash
      env:
        CF_ACCESS_CLIENT_ID: ${{ inputs.cloudflare-service-token-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.cloudflare-service-token-secret }}
      run: |
        echo "🧪 Testing SSH connection to ${{ inputs.server-hostname }}..."
        
        # Test connection with detailed debugging
        echo "🔍 SSH config contents:"
        cat ~/.ssh/config
        echo "🔍 SSH key file info:"
        ls -la ~/.ssh/id_rsa
        echo "🔍 SSH key validation:"
        ssh-keygen -l -f ~/.ssh/id_rsa || echo "SSH key validation failed"
        
        echo "🔍 Testing SSH connection with verbose output..."
        if timeout ${{ inputs.connect-timeout }} ssh -v ${{ inputs.host-alias }} "echo 'SSH connection successful!'" 2>&1; then
          echo "✅ SSH connection established successfully"
        else
          echo "❌ SSH connection failed, trying alternative approaches..."
          echo "🔍 Testing cloudflared directly:"
          timeout 10 cloudflared access tcp --hostname ${{ inputs.server-hostname }} &
          CF_PID=$!
          sleep 3
          kill $CF_PID 2>/dev/null || true
          echo "🔍 Testing SSH without ProxyCommand:"
          timeout 30 ssh -o ProxyCommand=none -o ConnectTimeout=10 ${{ inputs.server-user }}@${{ inputs.server-hostname }} "echo 'Direct SSH test'" 2>&1 || echo "Direct SSH failed (expected if behind Cloudflare)"
          exit 1
        fi
