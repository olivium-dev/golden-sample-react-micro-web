name: 'Cloudflare SSH Connection'
description: 'Establishes SSH connection through Cloudflare tunnel with service token authentication'
inputs:
  ssh-private-key:
    description: 'Base64 encoded SSH private key'
    required: true
  server-hostname:
    description: 'Cloudflare tunnel hostname'
    required: true
  server-user:
    description: 'SSH username'
    required: true
    default: 'ec2-user'
  cloudflare-service-token-id:
    description: 'Cloudflare Access Service Token ID'
    required: true
  cloudflare-service-token-secret:
    description: 'Cloudflare Access Service Token Secret'
    required: true
  connect-timeout:
    description: 'Connection timeout in seconds'
    required: false
    default: '60'
  host-alias:
    description: 'SSH host alias for subsequent connections'
    required: false
    default: 'target-server'

runs:
  using: 'composite'
  steps:
    - name: Install cloudflared
      shell: bash
      run: |
        echo "📥 Installing cloudflared..."
        
        # Download and install cloudflared
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb || sudo apt-get install -f -y
        
        # Verify installation
        cloudflared version
        echo "✅ cloudflared installed: $(cloudflared version)"

    - name: Setup SSH key and configuration
      shell: bash
      env:
        CF_ACCESS_CLIENT_ID: ${{ inputs.cloudflare-service-token-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.cloudflare-service-token-secret }}
      run: |
        echo "🔑 Setting up SSH key and configuration..."
        
        # Create SSH directory
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Decode and save SSH private key (robust handling)
        echo "${{ inputs.ssh-private-key }}" | tr -d '\n\r' | base64 -d > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Verify key was decoded properly
        echo "🔍 Verifying SSH key..."
        if head -1 ~/.ssh/id_rsa | grep -q "BEGIN"; then
          echo "✅ SSH key format looks valid"
        else
          echo "⚠️  Warning: SSH key may not be properly formatted"
          echo "First line: $(head -1 ~/.ssh/id_rsa | cut -c1-30)..."
        fi
        
        # Create SSH config with Cloudflare Access authentication
        cat > ~/.ssh/config << EOF
        Host ${{ inputs.host-alias }}
          HostName ${{ inputs.server-hostname }}
          User ${{ inputs.server-user }}
          IdentityFile ~/.ssh/id_rsa
          ProxyCommand cloudflared access ssh --hostname %h
          ConnectTimeout ${{ inputs.connect-timeout }}
          ServerAliveInterval 60
          ServerAliveCountMax 3
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF
        
        chmod 600 ~/.ssh/config
        
        echo "📝 SSH Config contents:"
        cat ~/.ssh/config
        echo ""
        echo "✅ SSH configuration created for host: ${{ inputs.host-alias }}"

    - name: Test SSH connection
      shell: bash
      env:
        CF_ACCESS_CLIENT_ID: ${{ inputs.cloudflare-service-token-id }}
        CF_ACCESS_CLIENT_SECRET: ${{ inputs.cloudflare-service-token-secret }}
      run: |
        echo "🧪 Testing SSH connection to ${{ inputs.server-hostname }}..."
        echo ""
        echo "🔐 Using Cloudflare Access Service Token for authentication"
        echo "   Token ID: ${CF_ACCESS_CLIENT_ID:0:8}..."
        echo ""
        
        # Test connection with verbose output for debugging
        echo "🔗 Attempting SSH connection..."
        if timeout ${{ inputs.connect-timeout }} ssh -v ${{ inputs.host-alias }} "echo 'SSH connection successful!'" 2>&1; then
          echo ""
          echo "✅ SSH connection established successfully"
        else
          echo ""
          echo "❌ SSH connection failed"
          echo ""
          echo "🔍 Debug information:"
          echo "  - Host alias: ${{ inputs.host-alias }}"
          echo "  - Server hostname: ${{ inputs.server-hostname }}"
          echo "  - Server user: ${{ inputs.server-user }}"
          echo "  - SSH key exists: $(test -f ~/.ssh/id_rsa && echo 'yes' || echo 'no')"
          echo "  - CF_ACCESS_CLIENT_ID set: $(test -n "$CF_ACCESS_CLIENT_ID" && echo 'yes' || echo 'no')"
          echo "  - CF_ACCESS_CLIENT_SECRET set: $(test -n "$CF_ACCESS_CLIENT_SECRET" && echo 'yes' || echo 'no')"
          echo ""
          echo "💡 Possible issues:"
          echo "  1. Cloudflare Service Token may be invalid or expired"
          echo "  2. Service Token may not have access to this application"
          echo "  3. SSH private key may be incorrect"
          echo "  4. User '${{ inputs.server-user }}' may not have SSH access"
          exit 1
        fi
