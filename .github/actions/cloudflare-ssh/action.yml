name: 'Setup SSH Connection via Cloudflare'
description: 'Sets up SSH connection to server via Cloudflare tunnel'

inputs:
  ssh-private-key:
    description: 'SSH private key for server access'
    required: true
  server-hostname:
    description: 'Server hostname'
    required: true
  server-user:
    description: 'SSH user for server'
    required: true
    default: 'ec2-user'
  host-alias:
    description: 'Host alias for SSH config'
    required: true
    default: 'fds-server'
  cloudflare-service-token-id:
    description: 'Cloudflare service token ID'
    required: false
  cloudflare-service-token-secret:
    description: 'Cloudflare service token secret'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Install Cloudflare CLI
      shell: bash
      run: |
        # Install cloudflared
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb
        rm cloudflared-linux-amd64.deb
        
        # Verify installation
        cloudflared version

    - name: Setup SSH key
      shell: bash
      run: |
        # Create SSH directory
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Add SSH private key with proper formatting
        echo "${{ inputs.ssh-private-key }}" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Validate SSH key format
        ssh-keygen -l -f ~/.ssh/id_rsa || {
          echo "Invalid SSH key format. Trying to fix..."
          # Remove any extra whitespace and ensure proper line endings
          sed 's/[[:space:]]*$//' ~/.ssh/id_rsa > ~/.ssh/id_rsa.tmp
          mv ~/.ssh/id_rsa.tmp ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        }
        
        # Add server to known hosts
        ssh-keyscan -H ${{ inputs.server-hostname }} >> ~/.ssh/known_hosts 2>/dev/null || true
        chmod 644 ~/.ssh/known_hosts

    - name: Setup Cloudflare tunnel
      shell: bash
      run: |
        # Create cloudflare config directory
        mkdir -p ~/.cloudflared
        
        # Setup service token authentication if provided
        if [ -n "${{ inputs.cloudflare-service-token-id }}" ] && [ -n "${{ inputs.cloudflare-service-token-secret }}" ]; then
          export CF_API_TOKEN="${{ inputs.cloudflare-service-token-secret }}"
          echo "Using Cloudflare service token authentication"
          
          # Create SSH config for Cloudflare tunnel with service token
          cat >> ~/.ssh/config << EOF
        Host ${{ inputs.host-alias }}
          HostName ${{ inputs.server-hostname }}
          User ${{ inputs.server-user }}
          IdentityFile ~/.ssh/id_rsa
          ProxyCommand cloudflared access ssh --hostname %h --service-token-id ${{ inputs.cloudflare-service-token-id }} --service-token-secret ${{ inputs.cloudflare-service-token-secret }}
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          LogLevel ERROR
        EOF
        else
          echo "No Cloudflare service tokens provided, using direct SSH connection"
          # Create SSH config for direct connection
          cat >> ~/.ssh/config << EOF
        Host ${{ inputs.host-alias }}
          HostName ${{ inputs.server-hostname }}
          User ${{ inputs.server-user }}
          IdentityFile ~/.ssh/id_rsa
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
          LogLevel ERROR
        EOF
        fi
        
        # Set proper permissions for SSH config
        chmod 600 ~/.ssh/config
        
        # Debug: Show SSH config
        echo "SSH configuration:"
        cat ~/.ssh/config
        
        # Debug: Test SSH key
        echo "Testing SSH key fingerprint:"
        ssh-keygen -l -f ~/.ssh/id_rsa
        
        # Test SSH connection with verbose output for debugging
        echo "Testing SSH connection..."
        ssh -v -o ConnectTimeout=30 -o BatchMode=yes ${{ inputs.host-alias }} "echo 'SSH connection successful'" 2>&1 || {
          echo "SSH connection failed. Trying alternative connection methods..."
          
          # Try direct connection without proxy
          echo "Trying direct SSH connection..."
          ssh -v -o ConnectTimeout=30 -o BatchMode=yes ${{ inputs.server-user }}@${{ inputs.server-hostname }} "echo 'Direct SSH connection successful'" 2>&1 || {
            echo "Direct SSH also failed. Please check:"
            echo "1. SSH private key is correct and matches the public key on the server"
            echo "2. Server hostname is accessible"
            echo "3. SSH user has proper permissions"
            echo "4. Cloudflare tunnel is properly configured (if using)"
            exit 1
          }
        }

    - name: Verify Docker on remote server
      shell: bash
      run: |
        echo "Verifying Docker installation on remote server..."
        ssh ${{ inputs.host-alias }} "docker --version && docker-compose --version"
