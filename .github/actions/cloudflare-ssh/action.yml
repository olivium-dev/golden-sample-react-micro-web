name: 'Cloudflare SSH Connection'
description: 'Establishes SSH connection through Cloudflare tunnel'
inputs:
  ssh-private-key:
    description: 'Base64 encoded SSH private key'
    required: true
  server-hostname:
    description: 'Cloudflare tunnel hostname'
    required: true
  server-user:
    description: 'SSH username'
    required: true
    default: 'ec2-user'
  connect-timeout:
    description: 'Connection timeout in seconds'
    required: false
    default: '60'
  host-alias:
    description: 'SSH host alias for subsequent connections'
    required: false
    default: 'target-server'

runs:
  using: 'composite'
  steps:
    - name: Install cloudflared
      shell: bash
      run: |
        echo "📥 Installing cloudflared..."
        
        # Download and install cloudflared
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
        sudo dpkg -i cloudflared-linux-amd64.deb || sudo apt-get install -f -y
        
        # Verify installation
        cloudflared version
        echo "✅ cloudflared installed: $(cloudflared version)"

    - name: Setup SSH key and configuration
      shell: bash
      run: |
        echo "🔑 Setting up SSH key and configuration..."
        
        # Create SSH directory
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        
        # Decode and save SSH private key (robust handling)
        echo "${{ inputs.ssh-private-key }}" | tr -d '\n\r' | base64 -d > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Verify key was decoded properly
        echo "🔍 Verifying SSH key..."
        if head -1 ~/.ssh/id_rsa | grep -q "BEGIN"; then
          echo "✅ SSH key format looks valid"
        else
          echo "⚠️  Warning: SSH key may not be properly formatted"
          echo "First line: $(head -1 ~/.ssh/id_rsa | cut -c1-30)..."
        fi
        
        # Create SSH config for Cloudflare tunnel (no indentation in heredoc)
        cat > ~/.ssh/config << 'EOF'
        Host ${{ inputs.host-alias }}
          HostName ${{ inputs.server-hostname }}
          User ${{ inputs.server-user }}
          IdentityFile ~/.ssh/id_rsa
          ProxyCommand cloudflared access tcp --hostname %h
          ConnectTimeout ${{ inputs.connect-timeout }}
          ServerAliveInterval 60
          ServerAliveCountMax 3
          StrictHostKeyChecking no
          UserKnownHostsFile /dev/null
        EOF
        
        # Replace variables in config (heredoc with single quotes doesn't expand)
        sed -i "s/\${{ inputs.host-alias }}/${{ inputs.host-alias }}/g" ~/.ssh/config
        sed -i "s/\${{ inputs.server-hostname }}/${{ inputs.server-hostname }}/g" ~/.ssh/config
        sed -i "s/\${{ inputs.server-user }}/${{ inputs.server-user }}/g" ~/.ssh/config
        sed -i "s/\${{ inputs.connect-timeout }}/${{ inputs.connect-timeout }}/g" ~/.ssh/config
        
        chmod 600 ~/.ssh/config
        
        echo "📝 SSH Config contents:"
        cat ~/.ssh/config
        echo ""
        echo "✅ SSH configuration created for host: ${{ inputs.host-alias }}"

    - name: Test SSH connection
      shell: bash
      run: |
        echo "🧪 Testing SSH connection to ${{ inputs.server-hostname }}..."
        echo ""
        
        # Test cloudflared connectivity first
        echo "🔍 Testing cloudflared tunnel connectivity..."
        if timeout 30 cloudflared access tcp --hostname ${{ inputs.server-hostname }} --url localhost:22222 &
        then
          sleep 3
          pkill -f "cloudflared access tcp" 2>/dev/null || true
          echo "✅ Cloudflare tunnel appears accessible"
        fi
        
        echo ""
        echo "🔗 Attempting SSH connection (with verbose output)..."
        
        # Test connection with verbose output for debugging
        if timeout ${{ inputs.connect-timeout }} ssh -v ${{ inputs.host-alias }} "echo 'SSH connection successful!'" 2>&1; then
          echo ""
          echo "✅ SSH connection established successfully"
        else
          echo ""
          echo "❌ SSH connection failed"
          echo ""
          echo "🔍 Debug information:"
          echo "  - Host alias: ${{ inputs.host-alias }}"
          echo "  - Server hostname: ${{ inputs.server-hostname }}"
          echo "  - Server user: ${{ inputs.server-user }}"
          echo "  - SSH key exists: $(test -f ~/.ssh/id_rsa && echo 'yes' || echo 'no')"
          echo "  - SSH key permissions: $(ls -la ~/.ssh/id_rsa 2>/dev/null || echo 'N/A')"
          echo ""
          echo "💡 Possible issues:"
          echo "  1. SSH private key may be incorrect or not properly base64 encoded"
          echo "  2. Cloudflare tunnel may not be configured for this hostname"
          echo "  3. Server may not be accessible via Cloudflare Access"
          echo "  4. User '${{ inputs.server-user }}' may not have SSH access"
          exit 1
        fi
