name: SSL Certificate Check and Renewal

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_renewal:
        description: 'Force certificate renewal even if not expiring'
        required: false
        default: 'false'
        type: boolean

env:
  SSH_PASSWORD: 'P@ssw0rd768'
  CLOUDFLARE_EMAIL: 'ouday.khaled@gmail.com'
  CLOUDFLARE_API_KEY: 'b6172b23e11b421f38069b4931bdf80bd6ff7'

jobs:
  check-and-renew-certificates:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass curl jq

      - name: Setup Cloudflare Tunnel
        run: |
          # Download and install cloudflared
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          
          # Create SSH config for tunnel
          mkdir -p ~/.ssh
          cat > ~/.ssh/config << 'EOF'
          Host tunnel-server
            HostName 192.168.2.73
            User ec2-user
            ProxyCommand cloudflared access ssh --hostname vps-73.fds-1.com
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Check Main Domain Certificate
        id: check_main
        run: |
          echo "Checking certificate for dev-creamat.fds-1.com..."
          
          CERT_CHECK=$(sshpass -p '${{ env.SSH_PASSWORD }}' ssh tunnel-server << 'EOFSH'
          DOMAIN="dev-creamat.fds-1.com"
          CERT_PATH="/etc/letsencrypt/live/${DOMAIN}/fullchain.pem"
          
          if [ ! -f "$CERT_PATH" ]; then
            echo "MISSING"
            exit 0
          fi
          
          # Check expiry date
          EXPIRY_DATE=$(sudo openssl x509 -enddate -noout -in "$CERT_PATH" | cut -d= -f2)
          EXPIRY_EPOCH=$(date -d "$EXPIRY_DATE" +%s)
          CURRENT_EPOCH=$(date +%s)
          DAYS_UNTIL_EXPIRY=$(( ($EXPIRY_EPOCH - $CURRENT_EPOCH) / 86400 ))
          
          if [ $DAYS_UNTIL_EXPIRY -lt 30 ]; then
            echo "EXPIRING:$DAYS_UNTIL_EXPIRY"
          else
            echo "VALID:$DAYS_UNTIL_EXPIRY"
          fi
          EOFSH
          )
          
          echo "Main domain status: $CERT_CHECK"
          echo "status=$CERT_CHECK" >> $GITHUB_OUTPUT

      - name: Check Subdomain Certificate
        id: check_subdomain
        run: |
          echo "Checking certificate for golden-sample.dev-creamat.fds-1.com..."
          
          CERT_CHECK=$(sshpass -p '${{ env.SSH_PASSWORD }}' ssh tunnel-server << 'EOFSH'
          DOMAIN="golden-sample.dev-creamat.fds-1.com"
          CERT_PATH="/etc/letsencrypt/live/${DOMAIN}/fullchain.pem"
          
          if [ ! -f "$CERT_PATH" ]; then
            echo "MISSING"
            exit 0
          fi
          
          # Check expiry date
          EXPIRY_DATE=$(sudo openssl x509 -enddate -noout -in "$CERT_PATH" | cut -d= -f2)
          EXPIRY_EPOCH=$(date -d "$EXPIRY_DATE" +%s)
          CURRENT_EPOCH=$(date +%s)
          DAYS_UNTIL_EXPIRY=$(( ($EXPIRY_EPOCH - $CURRENT_EPOCH) / 86400 ))
          
          if [ $DAYS_UNTIL_EXPIRY -lt 30 ]; then
            echo "EXPIRING:$DAYS_UNTIL_EXPIRY"
          else
            echo "VALID:$DAYS_UNTIL_EXPIRY"
          fi
          EOFSH
          )
          
          echo "Subdomain status: $CERT_CHECK"
          echo "status=$CERT_CHECK" >> $GITHUB_OUTPUT

      - name: Setup Cloudflare Credentials on Server
        if: contains(steps.check_main.outputs.status, 'MISSING') || contains(steps.check_main.outputs.status, 'EXPIRING') || contains(steps.check_subdomain.outputs.status, 'MISSING') || contains(steps.check_subdomain.outputs.status, 'EXPIRING') || inputs.force_renewal == true
        run: |
          echo "Setting up Cloudflare credentials on server..."
          
          sshpass -p '${{ env.SSH_PASSWORD }}' ssh tunnel-server << 'EOFSH'
          # Install certbot and cloudflare plugin if not already installed
          if ! command -v certbot &> /dev/null; then
            echo "Installing certbot..."
            sudo apt-get update
            sudo apt-get install -y certbot python3-certbot-dns-cloudflare
          fi
          
          # Create credentials directory
          sudo mkdir -p /root/.secrets
          sudo chmod 700 /root/.secrets
          
          # Create Cloudflare credentials file
          sudo tee /root/.secrets/cloudflare.ini > /dev/null << EOF
          dns_cloudflare_email = ${{ env.CLOUDFLARE_EMAIL }}
          dns_cloudflare_api_key = ${{ env.CLOUDFLARE_API_KEY }}
          EOF
          
          sudo chmod 600 /root/.secrets/cloudflare.ini
          echo "Cloudflare credentials configured"
          EOFSH

      - name: Generate/Renew Subdomain Certificate
        if: contains(steps.check_subdomain.outputs.status, 'MISSING') || contains(steps.check_subdomain.outputs.status, 'EXPIRING') || inputs.force_renewal == true
        run: |
          echo "Generating/renewing certificate for golden-sample.dev-creamat.fds-1.com..."
          
          sshpass -p '${{ env.SSH_PASSWORD }}' ssh tunnel-server << 'EOFSH'
          DOMAIN="golden-sample.dev-creamat.fds-1.com"
          
          echo "Generating certificate for $DOMAIN using Cloudflare DNS-01 challenge..."
          sudo certbot certonly \
            --dns-cloudflare \
            --dns-cloudflare-credentials /root/.secrets/cloudflare.ini \
            -d $DOMAIN \
            --non-interactive \
            --agree-tos \
            -m ouday.khaled@gmail.com \
            --dns-cloudflare-propagation-seconds 30
          
          if [ $? -eq 0 ]; then
            echo "Certificate generated successfully for $DOMAIN"
            
            # Verify certificate
            sudo openssl x509 -in /etc/letsencrypt/live/$DOMAIN/fullchain.pem -noout -text | grep "Subject:"
          else
            echo "Failed to generate certificate for $DOMAIN"
            exit 1
          fi
          EOFSH

      - name: Generate/Renew Main Domain Certificate
        if: contains(steps.check_main.outputs.status, 'MISSING') || contains(steps.check_main.outputs.status, 'EXPIRING') || inputs.force_renewal == true
        run: |
          echo "Generating/renewing certificate for dev-creamat.fds-1.com..."
          
          sshpass -p '${{ env.SSH_PASSWORD }}' ssh tunnel-server << 'EOFSH'
          DOMAIN="dev-creamat.fds-1.com"
          
          echo "Generating certificate for $DOMAIN using Cloudflare DNS-01 challenge..."
          sudo certbot certonly \
            --dns-cloudflare \
            --dns-cloudflare-credentials /root/.secrets/cloudflare.ini \
            -d $DOMAIN \
            --non-interactive \
            --agree-tos \
            -m ouday.khaled@gmail.com \
            --dns-cloudflare-propagation-seconds 30
          
          if [ $? -eq 0 ]; then
            echo "Certificate generated successfully for $DOMAIN"
            
            # Verify certificate
            sudo openssl x509 -in /etc/letsencrypt/live/$DOMAIN/fullchain.pem -noout -text | grep "Subject:"
          else
            echo "Failed to generate certificate for $DOMAIN"
            exit 1
          fi
          EOFSH

      - name: Configure Auto-Renewal
        if: contains(steps.check_main.outputs.status, 'MISSING') || contains(steps.check_subdomain.outputs.status, 'MISSING') || inputs.force_renewal == true
        run: |
          echo "Configuring certbot auto-renewal..."
          
          sshpass -p '${{ env.SSH_PASSWORD }}' ssh tunnel-server << 'EOFSH'
          # Test certbot renewal
          echo "Testing certbot renewal configuration..."
          sudo certbot renew --dry-run --dns-cloudflare --dns-cloudflare-credentials /root/.secrets/cloudflare.ini
          
          # Enable and start certbot renewal timer
          sudo systemctl enable certbot.timer
          sudo systemctl start certbot.timer
          
          # Verify timer is active
          sudo systemctl status certbot.timer --no-pager
          
          echo "Auto-renewal configured and enabled"
          EOFSH

      - name: Reload Nginx
        if: contains(steps.check_main.outputs.status, 'MISSING') || contains(steps.check_main.outputs.status, 'EXPIRING') || contains(steps.check_subdomain.outputs.status, 'MISSING') || contains(steps.check_subdomain.outputs.status, 'EXPIRING') || inputs.force_renewal == true
        run: |
          echo "Reloading nginx to apply new certificates..."
          
          sshpass -p '${{ env.SSH_PASSWORD }}' ssh tunnel-server << 'EOFSH'
          # Test nginx configuration
          sudo nginx -t
          
          # Reload nginx
          sudo systemctl reload nginx
          
          echo "Nginx reloaded successfully"
          EOFSH

      - name: Verify SSL Certificates
        run: |
          echo "Verifying SSL certificates are working..."
          
          # Test main domain
          echo "Testing dev-creamat.fds-1.com..."
          curl -I https://dev-creamat.fds-1.com/ || echo "Main domain SSL test failed"
          
          # Test subdomain
          echo "Testing golden-sample.dev-creamat.fds-1.com..."
          curl -I https://golden-sample.dev-creamat.fds-1.com/ || echo "Subdomain SSL test failed"

      - name: Summary
        run: |
          echo "================================"
          echo "SSL Certificate Check Complete"
          echo "================================"
          echo "Main Domain: ${{ steps.check_main.outputs.status }}"
          echo "Subdomain: ${{ steps.check_subdomain.outputs.status }}"
          echo ""
          echo "Next scheduled check: Tomorrow at 2 AM UTC"
          echo "================================"

