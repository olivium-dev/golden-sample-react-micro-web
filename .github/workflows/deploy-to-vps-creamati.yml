name: Deploy to VPS (Creamati CMS)

on:
  workflow_dispatch:
    inputs:
      server:
        description: 'Server address for SSH (Cloudflare tunnel hostname)'
        required: true
        default: 'vps-73.fds-1.com'
      ssh_user:
        description: 'SSH username'
        required: true
        default: 'ec2-user'
      app_port:
        description: 'External port for the application (Traefik)'
        required: true
        default: '3000'
      dashboard_port:
        description: 'External port for Traefik dashboard'
        required: true
        default: '8080'

jobs:
  deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Connection via Cloudflare
        uses: ./.github/actions/cloudflare-ssh
        with:
          ssh-private-key: ${{ secrets.CREAMAT_SSH_PRIVATE_KEY }}
          server-hostname: 'vps-73.fds-1.com'
          server-user: ${{ inputs.ssh_user || 'ec2-user' }}
          host-alias: 'creamati-server'

      - name: Deploy to VPS
        env:
          APP_PORT: ${{ inputs.app_port }}
          DASHBOARD_PORT: ${{ inputs.dashboard_port }}
        run: |
          echo "🚀 Deploying Creamati CMS to VPS..."
          echo "   Running docker-deploy-server.sh on server"
          echo ""
          
          # First, sync the repository to the server
          echo "📦 Step 1: Syncing repository to server..."
          ssh creamati-server "rm -rf ~/creamati-cms-deploy && mkdir -p ~/creamati-cms-deploy"
          rsync -avz --exclude 'node_modules' --exclude '.git' --exclude 'dist' ./ creamati-server:~/creamati-cms-deploy/
          
          echo ""
          echo "🏗️  Step 2: Running docker-deploy-server.sh on server..."
          ssh creamati-server "cd ~/creamati-cms-deploy && chmod +x scripts/docker-deploy-server.sh && ./scripts/docker-deploy-server.sh"
          
          echo ""
          echo "✅ Deployment complete!"

      - name: Deployment Summary
        run: |
          echo ""
          echo "=============================================="
          echo "🎉 DEPLOYMENT SUMMARY"
          echo "=============================================="
          echo ""
          echo "📦 Services deployed:"
          echo "  - Traefik (reverse proxy)"
          echo "  - Container App (main host)"
          echo "  - User Management MFE"
          echo "  - Data Grid MFE"
          echo "  - Analytics MFE"
          echo "  - Settings MFE"
          echo "  - Orders MFE"
          echo "  - Catalog MFE"
          echo ""
          echo "🌐 Access URLs:"
          echo "  - Application: http://${{ inputs.server }}:${{ inputs.app_port }}"
          echo "  - Traefik Dashboard: http://${{ inputs.server }}:${{ inputs.dashboard_port }}"
          echo ""
          echo "📝 To view logs on server:"
          echo "  ssh ${{ inputs.ssh_user }}@${{ inputs.server }}"
          echo "  cd ~/creamati-cms-deploy && docker compose logs -f"
          echo ""
