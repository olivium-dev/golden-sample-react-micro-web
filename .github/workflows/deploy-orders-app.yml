name: Deploy Orders App

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/orders-app/**'
      - '.github/workflows/deploy-orders-app.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/orders-app/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        cd frontend/shared-ui-lib
        npm install
        cd ../orders-app
        npm install
        
    - name: Build application
      run: |
        cd frontend/orders-app
        # Increase Node.js memory limit and add timeout
        export NODE_OPTIONS="--max-old-space-size=4096"
        timeout 10m npm run build
        

