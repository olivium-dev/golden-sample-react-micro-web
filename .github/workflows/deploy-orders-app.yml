name: Deploy Orders App

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/orders-app/**'
      - '.github/workflows/deploy-orders-app.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/orders-app/**'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        cd frontend/shared-ui-lib
        npm install
        cd ../orders-app
        npm install
        
    - name: Build application
      run: |
        cd frontend/orders-app
        npm run build
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: frontend/orders-app/build
        destination_dir: orders
